<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线语音转文字</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-container">
  <header class="header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>离线语音转文字</h1>
      <p>本地运行 · 无需联网 · 数据安全</p>
    </div>
    <div class="header-status" id="systemStatus">
      <span class="status-dot"></span>
      <span class="status-text">就绪</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">
      <span class="theme-icon">🌙</span>
    </button>
  </header>

  <main>
    <!-- 输入区域 -->
    <section class="input-section">
      <div class="file-type-toggle">
        <button class="toggle-btn active" data-type="audio">🎵 音频文件</button>
        <button class="toggle-btn" data-type="video">🎬 视频文件</button>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-content">
          <svg class="drop-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <p class="drop-title">拖拽文件到此处</p>
          <p class="drop-subtitle">或点击选择文件</p>
          <p class="drop-hint" id="formatHint">支持 MP3 / M4A / WAV / FLAC / OGG / AAC</p>
        </div>
        <input type="file" id="fileInput" accept="audio/*,video/*" hidden>
      </div>

      <div class="divider">
        <span>或者输入文件路径</span>
      </div>

      <div class="path-input-row">
        <input type="text" id="pathInput" class="path-input" placeholder="粘贴本地音频/视频文件路径...">
      </div>
    </section>

    <!-- 设置区域 -->
    <section class="settings-section">
      <div class="setting-group">
        <label class="setting-label">模型选择</label>
        <div class="setting-options">
          <label class="radio-card active" data-tooltip="速度与精度的平衡">
            <input type="radio" name="model" value="medium" checked>
            <span class="radio-card-title">Medium</span>
            <span class="radio-card-desc">均衡推荐</span>
          </label>
          <label class="radio-card" data-tooltip="更高精度，速度较慢">
            <input type="radio" name="model" value="large-v3">
            <span class="radio-card-title">Large‑V3</span>
            <span class="radio-card-desc">最高精度</span>
          </label>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">输出格式</label>
        <div class="setting-options">
          <label class="radio-card active" data-tooltip="纯文本，不含时间戳">
            <input type="radio" name="format" value="txt" checked>
            <span class="radio-card-title">TXT</span>
            <span class="radio-card-desc">纯文本</span>
          </label>
          <label class="radio-card" data-tooltip="带时间戳的字幕格式">
            <input type="radio" name="format" value="srt">
            <span class="radio-card-title">SRT</span>
            <span class="radio-card-desc">字幕格式</span>
          </label>
        </div>
      </div>

      <div class="setting-group" id="speakerStyleGroup">
        <label class="setting-label">说话人分离 &nbsp;·&nbsp; 结果样式</label>
        <div class="inline-select-row">
          <select class="select-input" id="speakerCount">
            <option value="none">不分离</option>
            <option value="auto">自动分离</option>
            <option value="1">1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
            <option value="5">5 人</option>
            <option value="6">6 人</option>
            <option value="7">7 人</option>
            <option value="8">8 人</option>
            <option value="9">9 人</option>
          </select>
          <select class="select-input" id="resultStyle">
            <option value="timestamp">含时间戳</option>
            <option value="no_timestamp">不含时间戳</option>
          </select>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">输出目录 <span class="optional">(可选)</span></label>
        <input type="text" id="outputDir" class="text-input" placeholder="默认为音频文件所在目录">
      </div>

      <div class="setting-group">
        <label class="setting-label">输出文件名 <span class="optional">(可选)</span></label>
        <input type="text" id="outputName" class="text-input" placeholder="默认为：原文件名+录音转文字">
      </div>
    </section>

    <!-- 开始按钮 -->
    <div class="action-row">
      <button class="btn-start" id="startBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <span>开始转写</span>
      </button>
    </div>

    <!-- 进度区域 -->
    <section class="progress-section" id="progressSection" hidden>
      <div class="progress-header">
        <span class="progress-status" id="progressStatus">准备中...</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-message" id="progressMessage"></p>
    </section>

    <!-- 结果区域 -->
    <section class="result-section" id="resultSection" hidden>
      <div class="result-card">
        <div class="result-header">
          <div class="result-icon success-icon" id="resultIcon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div>
            <h3>转写完成</h3>
            <p class="result-meta">
              共 <strong id="resultSegments">0</strong> 段 ·
              时长 <strong id="resultDuration">0</strong> 秒 ·
              语言 <strong id="resultLanguage">--</strong>
            </p>
          </div>
          <button class="btn-close" id="closeResult">×</button>
        </div>
        <div class="result-path">
          <span class="path-label">输出文件：</span>
          <code id="resultPath">--</code>
        </div>
        <details class="result-preview">
          <summary>点击预览文本内容</summary>
          <pre id="resultPreview"></pre>
        </details>
      </div>
    </section>

    <!-- 错误提示 -->
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<script src="/static/script.js"></script>
</body>
</html>
